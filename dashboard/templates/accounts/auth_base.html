{% load static %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Account{% endblock %} - My Dashboard</title>
    <script>
      try { document.documentElement.setAttribute("data-theme", localStorage.getItem("dashboard-theme") || "light"); } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/extras.css' %}" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        {% block auth_content %}{% endblock %}
      </div>
    </div>
  </body>
</html>
