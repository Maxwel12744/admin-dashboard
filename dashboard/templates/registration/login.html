{% load static %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in - My Dashboard</title>
    <script>
      try {
        document.documentElement.setAttribute(
          "data-theme",
          localStorage.getItem("dashboard-theme") || "light",
        );
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/extras.css' %}" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <h1>Log in</h1>
        <p class="auth-sub">
          Enter your username and password to open the dashboard.
        </p>
        <form method="post">
          {% csrf_token %} {% if form.non_field_errors %}
          <div class="alert alert-error">
            Your username or password is wrong. Check both and try again.
          </div>
          {% endif %}
          <div class="form-group">
            <label for="{{ form.username.id_for_label }}">Username</label>
            {{ form.username }}
          </div>
          <div class="form-group">
            <label for="{{ form.password.id_for_label }}">Password</label>
            {{ form.password }}
          </div>
          <input type="hidden" name="next" value="{{ next }}" />
          <button type="submit" class="btn btn-primary">Log in</button>
        </form>
      </div>
    </div>
  </body>
</html>
